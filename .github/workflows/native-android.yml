# Native Android build + publish, one store identity PER environment
# (infra/platforms/<platform>/envs/<env>.json: store.androidPackage,
# default app.munni.<platform>.<env>). Pushes build every environment
# whose channel matches the branch (dev → `dev`, master → `latest`) and
# that enables the Android app; the wizard dispatches one stack. Stack
# config (NATIVE_* variables, signing secrets) comes from the stack's
# GitHub environment, written by the setup.
name: Native Android
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Android {0}', inputs.stack) || format('Android ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Environment stack to build (munni-<platform>-<env>)'
        required: true
        type: string
      publish:
        description: 'Play upload (auto = when configured; skip = build only, e.g. before the one-time store setup)'
        type: choice
        options: [auto, skip]
        default: auto
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  stacks:
    # first-boot latch: fresh repo copies skip every run until the wizard marks the repo initialized
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Which environments
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node infra/ci/matrix.mjs --stack "${{ inputs.stack }}" --role env
          else
            node infra/ci/matrix.mjs --role env --feature android --channel "${{ github.ref_name == 'master' && 'latest' || 'dev' }}"
          fi

  android:
    needs: stacks
    if: ${{ needs.stacks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.stacks.outputs.include) }}
    # one Play publish at a time per stack: two pushes seconds apart raced
    # their Play edit sessions; the newer run supersedes the queued one
    concurrency:
      group: native-android-${{ matrix.stack }}
      cancel-in-progress: true
    environment: ${{ matrix.environment }}
    env:
      MUNNI_APP_ID: ${{ matrix.androidPackage }}
      MUNNI_SCHEME: ${{ matrix.scheme }}
      MUNNI_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # versionCode = commit count

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Resolve the app's host (universal links) from its public origin
        run: echo "MUNNI_HOST=$(node -p "new URL(process.env.ORIGIN || 'https://local.munni.invalid').hostname")" >> "$GITHUB_ENV"
        env:
          ORIGIN: ${{ vars.NATIVE_PUBLIC_ORIGIN }}

      - name: Bake catalog baseline
        run: node apps/web/scripts/bake-catalog.mjs
        env:
          CATALOG_URL: ${{ vars.NATIVE_API_URL }}/catalog

      - name: Build web bundle and sync the shell
        run: |
          npm ci
          npm run sync -w @munni/native
        env:
          VITE_API_URL: ${{ vars.NATIVE_API_URL }}
          VITE_PUBLIC_ORIGIN: ${{ vars.NATIVE_PUBLIC_ORIGIN }}
          VITE_LOGTO_ENDPOINT: ${{ vars.NATIVE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.NATIVE_LOGTO_APP_ID }}
          VITE_LOGTO_RESOURCE: ${{ vars.NATIVE_LOGTO_RESOURCE }}
          VITE_GLITCHTIP_DSN: ${{ vars.NATIVE_GLITCHTIP_DSN_ANDROID }}
          VITE_NATIVE_SCHEME: ${{ matrix.scheme }}
          VITE_CHANNEL: ${{ matrix.appChannel }}

      - name: Compute version (push = commit count; dispatch = seconds since 2026, never a repeat)
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=$(( $(date +%s) - 1767225600 ))" >> "$GITHUB_OUTPUT"
          else
            echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          fi
          NAME=$(node -p "require('./package.json').version")
          [ "${{ matrix.appChannel }}" = "production" ] || NAME="$NAME-${{ matrix.env }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Bake the platform's CA into the app (the lcl family CA)
        if: vars.NATIVE_FAMILY_CA_PEM != ''
        run: printf '%s\n' "$CA_PEM" > apps/native/android/app/src/app/res/raw/family_ca.pem
        env:
          CA_PEM: ${{ vars.NATIVE_FAMILY_CA_PEM }}

      - name: Rebrand the flavor's static files for this environment
        working-directory: apps/native/android/app/src/app
        # the google-services stub must match the applicationId or the build fails; shortcuts target the real package/scheme
        run: |
          sed -i "s/app\.munni\.placeholder/${MUNNI_APP_ID}/g" google-services.json
          sed -i "s/app\.munni\.placeholder/${MUNNI_APP_ID}/g; s/munni-placeholder:/${MUNNI_SCHEME}:/g" res/xml/shortcuts.xml
          grep -c "$MUNNI_APP_ID" google-services.json res/xml/shortcuts.xml

      # the wizard's Firebase automation hands the REAL config as a variable — push works out of the box
      - name: Bake the Firebase config
        if: vars.NATIVE_GOOGLE_SERVICES_B64 != ''
        run: echo "$GS_B64" | base64 -d > apps/native/android/app/src/app/google-services.json
        env:
          GS_B64: ${{ vars.NATIVE_GOOGLE_SERVICES_B64 }}

      - name: Assemble debug APK
        working-directory: apps/native/android
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --no-daemon
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: munni-android-debug-${{ matrix.stack }}
          path: apps/native/android/app/build/outputs/apk/app/debug/app-app-debug.apk
          retention-days: 30

      # ---- signed release: the keystore comes from the environment (minted by the wizard,
      # kept because Play pins the first upload key per package) — or is minted right here
      # for a fresh environment and persisted into it
      - name: Restore or mint the upload keystore
        id: keystore
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$GH_TOKEN" ]; then
            PASS=$(openssl rand -hex 24)
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.keystore" \
              -alias munni-upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=munni upload key"
            printf %s "$PASS" > "$RUNNER_TEMP/upload.pass"
            B64=$(base64 -w0 "$RUNNER_TEMP/upload.keystore")
            printf %s "$B64"       | gh secret set ANDROID_KEYSTORE_BASE64 --env "${{ matrix.environment }}" --repo "$GH_REPO"
            printf %s "$PASS"      | gh secret set ANDROID_KEYSTORE_PASSWORD --env "${{ matrix.environment }}" --repo "$GH_REPO"
            printf %s munni-upload | gh secret set ANDROID_KEY_ALIAS --env "${{ matrix.environment }}" --repo "$GH_REPO"
            printf %s "$PASS"      | gh secret set ANDROID_KEY_PASSWORD --env "${{ matrix.environment }}" --repo "$GH_REPO"
            echo "::notice title=Upload keystore minted::Signed this build and stored as secrets of ${{ matrix.environment }} — every future build signs with the same key."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}

      - name: Build signed release bundle
        if: steps.keystore.outputs.present == 'true'
        working-directory: apps/native/android
        run: |
          if [ -f "$RUNNER_TEMP/upload.pass" ]; then
            ANDROID_KEYSTORE_PASSWORD=$(cat "$RUNNER_TEMP/upload.pass")
            ANDROID_KEY_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            ANDROID_KEY_ALIAS=munni-upload
            export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS
          fi
          ./gradlew bundleAppRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}

      - name: Upload release bundle artifact
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: munni-android-release-${{ matrix.stack }}
          path: apps/native/android/app/build/outputs/bundle/appRelease/app-app-release.aab
          retention-days: 90

      # ---- Play internal track: the app record is the ONE manual step per package
      # (Play only adds releases to existing apps) — a missing record is a warning,
      # the signed .aab artifact is the deliverable until then
      - name: Publish to Play internal track
        id: play
        if: ${{ inputs.publish != 'skip' && steps.keystore.outputs.present == 'true' && env.PLAY_JSON != '' }}
        continue-on-error: true
        run: node .github/scripts/play-publish.mjs
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ matrix.androidPackage }}
          AAB_PATH: apps/native/android/app/build/outputs/bundle/appRelease/app-app-release.aab
          MAPPING_PATH: apps/native/android/app/build/outputs/mapping/appRelease/mapping.txt
          TRACK: internal

      - name: Play upload verdict
        if: ${{ steps.play.outcome == 'failure' }}
        run: |
          echo "::warning title=Play upload did not finish::Read the 'Publish to Play internal track' step above for the exact reason — no app record for ${{ matrix.androidPackage }} yet, service account not invited, its Cloud project's Play API disabled, or a concurrent edit. The signed .aab artifact on this run is the manual fallback; once the store accepts, every later build publishes itself."
