name: Build & push images

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'apps/web/**'
      - 'server/**'
      - 'package-lock.json'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

# GHCR: the Synology registry is LAN-only (GH runners time out reaching it),
# so images live in GitHub's registry and the NAS pulls from ghcr.io.
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  api-tests:
    # first-boot latch: fresh repo copies skip every run until the
    # wizard marks the repo initialized (variable MUNNI_INITIALIZED)
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build server/Munni.slnx
      # the connector agent's live-view and redaction tests drive a real
      # headless Chromium; the Playwright package ships the installer
      - name: Chromium for the agent's browser tests
        run: pwsh server/tests/connectors/Connector.Kit.Agent.Tests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps
      - run: dotnet test server/Munni.slnx --no-build --collect:"XPlat Code Coverage" --results-directory coverage
      # Munni.Api is gated by MSBuild (server/tests/Directory.Build.props);
      # the connector assemblies are covered by several suites each, so
      # their 85 % floor is the union over every report of this run
      - name: Coverage gate
        run: |
          status=0
          node server/tests/coverage-gate.mjs coverage > gate.txt || status=$?
          cat gate.txt
          { echo '### Server line coverage (floor 85 % per assembly)'; echo; sed 's/^coverage gate: /- /' gate.txt; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # PI1: one native build per architecture (no QEMU — full-speed .NET
  # and Vite builds), merged into one multi-arch tag by the manifest
  # job below. The NAS (amd64) and a Raspberry Pi (arm64) pull the
  # same :dev/:latest tag and get their own layers.
  images:
    # first-boot latch: fresh repo copies skip every run until the
    # wizard marks the repo initialized (variable MUNNI_INITIALIZED)
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    needs: api-tests
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      build: ${{ steps.meta.outputs.build }}
    # the images are stack-agnostic: every stack configures them through the
    # runtime overlay (MUNNI_* env at container start) — nothing is baked
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build number and channel
        id: meta
        run: |
          echo "build=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT
          # master -> latest, dev -> dev (the platform config picks a channel per environment)
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            echo "channel=dev" >> $GITHUB_OUTPUT
          else
            echo "channel=latest" >> $GITHUB_OUTPUT
          fi

      # the committed catalog baseline ships as-is (the api serves the published one at runtime)
      - name: Bake catalog baseline
        run: node apps/web/scripts/bake-catalog.mjs
        env:
          CATALOG_URL: ''

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/src/Munni.Api/Dockerfile
          push: true
          # arch-suffixed staging tag only — the channel tags are minted
          # by the manifest job once BOTH arches exist
          tags: ${{ env.REGISTRY }}/munni-api:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}

      - name: Build & push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            BUILD_NUMBER=${{ steps.meta.outputs.build }}
          tags: ${{ env.REGISTRY }}/munni-web:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}

      - name: Build & push admin
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/munni-admin:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=admin-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=admin-${{ matrix.arch }}

      # the shared-services cockpit — a separate app from the env admin
      # dashboard. Nothing is baked: every stack that runs it configures
      # it through the runtime overlay (MUNNI_* env at container start).
      - name: Build & push control
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/control/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/munni-control:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=control-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=control-${{ matrix.arch }}

      # the connector control plane of an environment (#367): every provider
      # pack, no browser — arch-agnostic like the api
      - name: Build & push connector-api
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/src/connectors/Connector.Api/Dockerfile
          push: true
          build-args: BUILD_NUMBER=${{ steps.meta.outputs.build }}
          tags: ${{ env.REGISTRY }}/munni-connector-api:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=connector-api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=connector-api-${{ matrix.arch }}

      # the agent carries Chromium (Playwright's image) — amd64 only until
      # Chromium under Playwright on arm64 is verified; the manifest job
      # tags it from the one architecture
      - name: Build & push connector-agent
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: server
          file: server/src/connectors/Connector.Agent/Dockerfile
          push: true
          build-args: BUILD_NUMBER=${{ steps.meta.outputs.build }}
          tags: ${{ env.REGISTRY }}/munni-connector-agent:${{ steps.meta.outputs.channel }}-${{ steps.meta.outputs.build }}-${{ matrix.arch }}
          cache-from: type=gha,scope=connector-agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=connector-agent-${{ matrix.arch }}

  # merge the per-arch pushes into the channel tags the hosts pull
  manifest:
    # first-boot latch: fresh repo copies skip every run until the
    # wizard marks the repo initialized (variable MUNNI_INITIALIZED)
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        run: |
          CHANNEL='${{ needs.images.outputs.channel }}'
          BUILD='${{ needs.images.outputs.build }}'
          for image in munni-api munni-web munni-admin munni-control munni-connector-api; do
            docker buildx imagetools create \
              -t "$REGISTRY/$image:$CHANNEL" \
              -t "$REGISTRY/$image:$CHANNEL-$BUILD" \
              "$REGISTRY/$image:$CHANNEL-$BUILD-amd64" \
              "$REGISTRY/$image:$CHANNEL-$BUILD-arm64"
            echo "### $image:$CHANNEL" >> $GITHUB_STEP_SUMMARY
            docker buildx imagetools inspect "$REGISTRY/$image:$CHANNEL" | grep -E 'Platform|Digest' | head -6 >> $GITHUB_STEP_SUMMARY
          done
          # the agent exists for amd64 only (#367): its channel tags point at that one build
          docker buildx imagetools create \
            -t "$REGISTRY/munni-connector-agent:$CHANNEL" \
            -t "$REGISTRY/munni-connector-agent:$CHANNEL-$BUILD" \
            "$REGISTRY/munni-connector-agent:$CHANNEL-$BUILD-amd64"
          echo "### munni-connector-agent:$CHANNEL (amd64)" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect "$REGISTRY/munni-connector-agent:$CHANNEL" | grep -E 'Platform|Digest' | head -4 >> $GITHUB_STEP_SUMMARY
