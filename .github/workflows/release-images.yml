name: Build & push images

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'server/**'
      - 'package-lock.json'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

# GHCR: the Synology registry is LAN-only (GH runners time out reaching it),
# so images live in GitHub's registry and the NAS pulls from ghcr.io.
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test server/Munni.slnx

  images:
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build number
        id: meta
        run: echo "build=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/src/Munni.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/munni-api:latest
            ${{ env.REGISTRY }}/munni-api:${{ steps.meta.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # production config from repo Variables (Settings -> Variables);
          # sensible *.okkes.synology.me defaults until they are set
          build-args: |
            BUILD_NUMBER=${{ steps.meta.outputs.build }}
            VITE_API_URL=${{ vars.VITE_API_URL || 'https://munni-api.okkes.synology.me' }}
            VITE_LOGTO_ENDPOINT=${{ vars.VITE_LOGTO_ENDPOINT || 'https://logto.okkes.synology.me' }}
            VITE_LOGTO_APP_ID=${{ vars.VITE_LOGTO_APP_ID || '' }}
            VITE_LOGTO_RESOURCE=${{ vars.VITE_LOGTO_RESOURCE || 'https://munni-api.okkes.synology.me' }}
            VITE_GLITCHTIP_DSN=${{ vars.VITE_GLITCHTIP_DSN || '' }}
          tags: |
            ${{ env.REGISTRY }}/munni-web:latest
            ${{ env.REGISTRY }}/munni-web:${{ steps.meta.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
