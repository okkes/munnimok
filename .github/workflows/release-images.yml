name: Build & push images

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/web/**'
      - 'server/**'
      - 'package-lock.json'
      - '.github/workflows/release-images.yml'
  workflow_dispatch:

env:
  REGISTRY: cr.okkes.synology.me

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet test server/Munni.slnx

  images:
    needs: api-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute build number
        id: meta
        run: echo "build=$(git rev-list --count HEAD)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: server
          file: server/src/Munni.Api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/munni-api:latest
            ${{ env.REGISTRY }}/munni-api:${{ steps.meta.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            BUILD_NUMBER=${{ steps.meta.outputs.build }}
          tags: |
            ${{ env.REGISTRY }}/munni-web:latest
            ${{ env.REGISTRY }}/munni-web:${{ steps.meta.outputs.build }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
