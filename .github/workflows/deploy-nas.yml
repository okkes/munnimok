# Push the deploy bundle to the Synology NAS via the FileStation API
# (user request: no SSH). Runs after the container images are built.
# The NAS-side poller (deploy/nas/apply.sh, via the DSM Task Scheduler)
# picks up the new stamp and runs update.sh.
#
# Channels:
#   master → munni-deploy.tgz + VERSION           (prod + staging infra,
#            including the rendered .env)
#   dev    → munni-deploy-staging.tgz + VERSION_STAGING (staging only,
#            so staging tests dev's compose changes before a release)
#   manual dispatch with channel=iac-prod|iac-staging|iac-both →
#            munni-deploy-iac-*.tgz + VERSION_IAC_* (the IaC twins:
#            compose+env rendered from infra/ stack files, unpacked by
#            the poller into their own /volume1/docker/<stack>/ dirs)
#
# Env files are rendered from deploy/env/.env.nas: every ${NAS_*}
# placeholder is filled from the same-named secret, handed to
# deploy/nas/render-env.sh as an env var NAMED EXPLICITLY below (user
# ruling 2026-09-16: no toJSON(secrets) — dumping the whole secrets
# context is the pattern GitHub's scanner holds public-repo runs for,
# and that hold silently stopped every deploy from 2026-09-08 to 09-15).
# Adding a key = template line + secret + one env line in the job;
# infra/tests/deploy-nas.test.mjs names a placeholder without its line.
# The job runs in the production/staging GitHub Environment matching
# the branch, so one secret NAME can carry a different value per stack
# (VAPID pair, postgres password); repo-level secrets are the shared
# defaults. The master channel renders .env, the dev channel renders
# .env.staging — no whole-.env secret, no manual NAS edits
# (deploy/nas/README.md).
#
# Secrets required (besides the NAS_* env values):
#   SYNOLOGY_URL       e.g. https://<your-nas-domain>:5001
#   SYNOLOGY_USER      a dedicated DSM account (FileStation write perm,
#                      2FA OFF — the login API can't do interactive OTP;
#                      Adaptive MFA matters only for the IaC bootstrap's
#                      Control Panel calls, see infra/README.md B1-1)
#   SYNOLOGY_PASS      that account's password
#   SYNOLOGY_PATH      target folder, e.g. /docker/munni/published
name: Deploy to NAS

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Deploy channel'
        type: choice
        options: [live, iac-prod, iac-staging, iac-both]
        default: live
  # after images rebuild…
  workflow_run:
    workflows: ["Build & push images"]
    types: [completed]
    branches: [master, dev]
  # …and directly for infra-only changes, which never rebuild images
  push:
    branches: [master, dev]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-nas.yml'

permissions:
  contents: read
  actions: write # deploy-iac re-runs the IaC bootstrap once the NAS has seeded Logto (GITHUB_TOKEN fallback)

jobs:
  deploy:
    # workflow_run: only when the image build actually succeeded;
    # push (infra-only) and manual dispatch always deploy — unless the
    # dispatch asked for an iac channel (handled by deploy-iac below).
    # First-boot latch: fresh copies skip until MUNNI_INITIALIZED.
    if: ${{ vars.MUNNI_INITIALIZED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || (inputs.channel || 'live') == 'live') }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # bundle the files as they are on the branch that built the images
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Live channel configured?
        id: live
        # a wizard copy runs only the IaC twins (deploy-iac below): it holds
        # no live-channel secrets, and a push touching deploy/** — the wizard's
        # pipeline sync, say — must not go red for that (2026-09-16)
        run: |
          if [ -z "${NAS_POSTGRES_PASSWORD:-}" ]; then
            echo "::notice::live channel not configured (no NAS_POSTGRES_PASSWORD secret) — this repository deploys only the IaC twins; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NAS_POSTGRES_PASSWORD: ${{ secrets.NAS_POSTGRES_PASSWORD }}

      - name: Assemble the deploy bundle
        id: bundle
        if: ${{ steps.live.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          STAGE="$RUNNER_TEMP/bundle"
          mkdir -p "$STAGE"
          if [ "$BRANCH" = "master" ]; then
            # prod channel: the full running stack's infra + rendered .env
            cp deploy/docker-compose.yml deploy/docker-compose.staging.yml deploy/update.sh deploy/nas/apply.sh "$STAGE/"
            for d in nginx initdb import-watch; do
              [ -d "deploy/$d" ] && cp -r "deploy/$d" "$STAGE/"
            done
            bash deploy/nas/render-env.sh deploy/env/.env.nas "$STAGE/.env"
            echo "bundle=munni-deploy.tgz" >> "$GITHUB_OUTPUT"
            echo "stamp=VERSION" >> "$GITHUB_OUTPUT"
          else
            # staging channel: only what the staging stack runs from dev,
            # plus its own env rendered from the staging environment
            cp deploy/docker-compose.staging.yml deploy/update.sh deploy/nas/apply.sh "$STAGE/"
            bash deploy/nas/render-env.sh deploy/env/.env.nas "$STAGE/.env.staging"
            echo "bundle=munni-deploy-staging.tgz" >> "$GITHUB_OUTPUT"
            echo "stamp=VERSION_STAGING" >> "$GITHUB_OUTPUT"
          fi
          tar -czf "$RUNNER_TEMP/bundle.tgz" -C "$STAGE" .
          # NOT $GITHUB_SHA: under workflow_run that is the DEFAULT-branch
          # tip — constant across dev pushes, so the NAS poller saw
          # "nothing new" and staging froze (2026-07-24). Stamp with the
          # commit that actually built the images.
          echo "${{ github.event.workflow_run.head_sha || github.sha }}" > "$RUNNER_TEMP/stamp.txt"
        env:
          # every placeholder of deploy/env/.env.nas, by name (see the header)
          NAS_ADMIN_SUBS: ${{ secrets.NAS_ADMIN_SUBS }}
          NAS_API_SENTRY_DSN: ${{ secrets.NAS_API_SENTRY_DSN }}
          NAS_DOMAIN: ${{ secrets.NAS_DOMAIN }}
          NAS_ENABLEBANKING_APPLICATION_ID: ${{ secrets.NAS_ENABLEBANKING_APPLICATION_ID }}
          NAS_ENABLEBANKING_PRIVATE_KEY_PEM: ${{ secrets.NAS_ENABLEBANKING_PRIVATE_KEY_PEM }}
          NAS_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.NAS_FCM_SERVICE_ACCOUNT_JSON }}
          NAS_GHCR_PAT: ${{ secrets.NAS_GHCR_PAT }}
          NAS_GLITCHTIP_EMAIL_URL: ${{ secrets.NAS_GLITCHTIP_EMAIL_URL }}
          NAS_GLITCHTIP_SECRET_KEY: ${{ secrets.NAS_GLITCHTIP_SECRET_KEY }}
          NAS_GOCARDLESS_SECRET_ID: ${{ secrets.NAS_GOCARDLESS_SECRET_ID }}
          NAS_GOCARDLESS_SECRET_KEY: ${{ secrets.NAS_GOCARDLESS_SECRET_KEY }}
          NAS_IMPORT_WATCH_OWNER_SUB: ${{ secrets.NAS_IMPORT_WATCH_OWNER_SUB }}
          NAS_LOGODEV_PUBLIC_TOKEN: ${{ secrets.NAS_LOGODEV_PUBLIC_TOKEN }}
          NAS_LOGODEV_SECRET_KEY: ${{ secrets.NAS_LOGODEV_SECRET_KEY }}
          NAS_LOGTO_M2M_APP_ID: ${{ secrets.NAS_LOGTO_M2M_APP_ID }}
          NAS_LOGTO_M2M_APP_SECRET: ${{ secrets.NAS_LOGTO_M2M_APP_SECRET }}
          NAS_PGADMIN_PASSWORD: ${{ secrets.NAS_PGADMIN_PASSWORD }}
          NAS_POSTGRES_PASSWORD: ${{ secrets.NAS_POSTGRES_PASSWORD }}
          NAS_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.NAS_PUSH_VAPID_PRIVATE_KEY }}
          NAS_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.NAS_PUSH_VAPID_PUBLIC_KEY }}

      - name: Upload to Synology FileStation (bundle first, stamp last)
        if: ${{ steps.live.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/bundle.tgz" "$RUNNER_TEMP/${{ steps.bundle.outputs.bundle }}"
          cp "$RUNNER_TEMP/stamp.txt" "$RUNNER_TEMP/${{ steps.bundle.outputs.stamp }}"
          # the poller itself lives in the live dir — the PARENT of the
          # published folder (the one rule: dsm.mjs publishedPathParts) —
          # shipped here on every deploy, so nothing is copied by hand
          # (the scheduled task runs a throwaway copy, so overwriting is safe)
          : "${SYNOLOGY_PATH:?SYNOLOGY_PATH secret missing}"
          LIVE="${SYNOLOGY_PATH%/}"; LIVE="${LIVE%/*}"
          if [ -z "$LIVE" ] || [ "$LIVE" = "${SYNOLOGY_PATH%/}" ]; then
            echo "::error::SYNOLOGY_PATH must be a folder inside a shared folder, e.g. /docker/munni/published"; exit 1
          fi
          SYNOLOGY_PATH="$LIVE" bash deploy/nas/upload.sh deploy/nas/apply.sh
          bash deploy/nas/upload.sh \
            "$RUNNER_TEMP/${{ steps.bundle.outputs.bundle }}" \
            "$RUNNER_TEMP/${{ steps.bundle.outputs.stamp }}"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}

      - name: Ensure the poller task (DSM Task Scheduler, through the API)
        # the live pipeline owns its own poller in its own live dir — the
        # counterpart of what the IaC prod twin's bootstrap does for the
        # twins' dir. Needs an administrator deploy account; a refusal is a
        # warning (the task may exist by hand), any other failure is red.
        if: ${{ steps.live.outputs.skip != 'true' }}
        run: node deploy/nas/ensure-poller.mjs --name "munni deploy poller (live)"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}

  # ── IaC twins: rendered from infra/ stack files, dispatched from the
  # setup wizard (or Actions UI). The poller (deploy/nas/apply.sh) unpacks
  # each into its own /volume1/docker/<stack>/ and composes it up there.
  deploy-iac:
    if: ${{ vars.MUNNI_INITIALIZED == 'true' && github.event_name == 'workflow_dispatch' && (inputs.channel || 'live') != 'live' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stack: ${{ fromJSON(inputs.channel == 'iac-both' && '["munni-iac-prod","munni-iac-staging"]' || (inputs.channel == 'iac-prod' && '["munni-iac-prod"]' || '["munni-iac-staging"]')) }}
    # the stack's environment carries its minted secrets + written-back
    # variables; repo-level roots (SYNOLOGY_*, NAS_GHCR_PAT…) merge in
    environment: ${{ matrix.stack == 'munni-iac-prod' && 'iac-production' || 'iac-staging' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Render + assemble the iac bundle
        id: bundle
        run: |
          set -euo pipefail
          node infra/bootstrap.mjs --stack "${{ matrix.stack }}" --render-only
          SRC="infra/rendered/${{ matrix.stack }}"
          STAGE="$RUNNER_TEMP/bundle"
          mkdir -p "$STAGE"
          cp "$SRC/docker-compose.${{ matrix.stack }}.yml" deploy/update.sh "$STAGE/"
          cp -r "$SRC/initdb" "$STAGE/"
          if [ "${{ matrix.stack }}" = "munni-iac-prod" ]; then
            ENV_NAME=".env"; BUNDLE="munni-deploy-iac-prod.tgz"; STAMP="VERSION_IAC_PROD"
          else
            # update.sh resolves *staging* compose files to .env.staging
            ENV_NAME=".env.staging"; BUNDLE="munni-deploy-iac-staging.tgz"; STAMP="VERSION_IAC_STAGING"
          fi
          bash deploy/nas/render-env.sh "$SRC/.env.${{ matrix.stack }}" "$STAGE/$ENV_NAME"
          tar -czf "$RUNNER_TEMP/$BUNDLE" -C "$STAGE" .
          echo "${{ github.sha }}" > "$RUNNER_TEMP/$STAMP"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
        env:
          IAC_DOMAIN: ${{ secrets.IAC_DOMAIN }}
          # every placeholder of the rendered .env.<stack>, by name: the stack's
          # secrets (minted into its environment by bootstrap; repo-level roots
          # merge in) and the variables the logto/glitchtip modules wrote back
          NAS_ADMIN_SUBS: ${{ secrets.NAS_ADMIN_SUBS }}
          NAS_API_SENTRY_DSN: ${{ secrets.NAS_API_SENTRY_DSN }}
          NAS_ENABLEBANKING_APPLICATION_ID: ${{ secrets.NAS_ENABLEBANKING_APPLICATION_ID }}
          NAS_ENABLEBANKING_PRIVATE_KEY_PEM: ${{ secrets.NAS_ENABLEBANKING_PRIVATE_KEY_PEM }}
          NAS_FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.NAS_FCM_SERVICE_ACCOUNT_JSON }}
          NAS_GHCR_PAT: ${{ secrets.NAS_GHCR_PAT }}
          NAS_GLITCHTIP_EMAIL_URL: ${{ secrets.NAS_GLITCHTIP_EMAIL_URL }}
          NAS_GLITCHTIP_SECRET_KEY: ${{ secrets.NAS_GLITCHTIP_SECRET_KEY }}
          NAS_GOCARDLESS_SECRET_ID: ${{ secrets.NAS_GOCARDLESS_SECRET_ID }}
          NAS_GOCARDLESS_SECRET_KEY: ${{ secrets.NAS_GOCARDLESS_SECRET_KEY }}
          NAS_LOGODEV_PUBLIC_TOKEN: ${{ secrets.NAS_LOGODEV_PUBLIC_TOKEN }}
          NAS_LOGODEV_SECRET_KEY: ${{ secrets.NAS_LOGODEV_SECRET_KEY }}
          NAS_LOGTO_M2M_APP_ID: ${{ secrets.NAS_LOGTO_M2M_APP_ID }}
          NAS_LOGTO_M2M_APP_SECRET: ${{ secrets.NAS_LOGTO_M2M_APP_SECRET }}
          NAS_POSTGRES_PASSWORD: ${{ secrets.NAS_POSTGRES_PASSWORD }}
          NAS_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.NAS_PUSH_VAPID_PRIVATE_KEY }}
          NAS_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.NAS_PUSH_VAPID_PUBLIC_KEY }}
          VAULT_SIGNUPS_ALLOWED: ${{ secrets.VAULT_SIGNUPS_ALLOWED }}
          # the Logto seed the poller applies on the NAS (prod twin's env only; empty for staging)
          IAC_LOGTO_INFRA_M2M_ID: ${{ secrets.IAC_LOGTO_INFRA_M2M_ID }}
          IAC_LOGTO_INFRA_M2M_SECRET: ${{ secrets.IAC_LOGTO_INFRA_M2M_SECRET }}
          IAC_LOGTO_ADMIN_M2M_ID: ${{ secrets.IAC_LOGTO_ADMIN_M2M_ID }}
          IAC_LOGTO_ADMIN_M2M_SECRET: ${{ secrets.IAC_LOGTO_ADMIN_M2M_SECRET }}
          VITE_GLITCHTIP_DSN: ${{ vars.VITE_GLITCHTIP_DSN }}
          VITE_GLITCHTIP_DSN_ADMIN: ${{ vars.VITE_GLITCHTIP_DSN_ADMIN }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_APP_ID_ADMIN: ${{ vars.VITE_LOGTO_APP_ID_ADMIN }}
      - name: Upload to Synology FileStation (bundle first, stamp last)
        id: upload
        run: |
          set -euo pipefail
          # the poller rides along (see the live job above)
          : "${SYNOLOGY_PATH:?SYNOLOGY_PATH secret missing}"
          LIVE="${SYNOLOGY_PATH%/}"; LIVE="${LIVE%/*}"
          if [ -z "$LIVE" ] || [ "$LIVE" = "${SYNOLOGY_PATH%/}" ]; then
            echo "::error::SYNOLOGY_PATH must be a folder inside a shared folder, e.g. /docker/munni/published"; exit 1
          fi
          SYNOLOGY_PATH="$LIVE" bash deploy/nas/upload.sh deploy/nas/apply.sh
          bash deploy/nas/upload.sh \
            "$RUNNER_TEMP/${{ steps.bundle.outputs.bundle }}" \
            "$RUNNER_TEMP/${{ steps.bundle.outputs.stamp }}"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}

      # ── no click left (2026-09-17): the prod twin's first Deploy carries the
      # Logto seed; once the poller applied it and Logto answers with the minted
      # credential, the bootstrap runs once more and turns sign-in into code
      # (apps, console admin, app admin, vault) — it chains staging + Deploy
      # again so the frontends pick the app ids up. Ends by itself: the
      # written-back VITE_LOGTO_APP_ID means sign-in is wired.
      - name: Wait for the poller, read its log, and see whether Logto is seeded
        id: applied
        if: ${{ matrix.stack == 'munni-iac-prod' }}
        run: node deploy/nas/after-apply.mjs --stack "${{ matrix.stack }}" --stamp "${{ github.sha }}"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
          IAC_DOMAIN: ${{ secrets.IAC_DOMAIN }}
          IAC_LOGTO_INFRA_M2M_ID: ${{ secrets.IAC_LOGTO_INFRA_M2M_ID }}
          IAC_LOGTO_INFRA_M2M_SECRET: ${{ secrets.IAC_LOGTO_INFRA_M2M_SECRET }}
      - name: Sign-in not wired yet — run the IaC bootstrap once more (it chains staging + Deploy)
        if: ${{ matrix.stack == 'munni-iac-prod' && steps.applied.outputs.logto == 'answers' && vars.VITE_LOGTO_APP_ID == '' }}
        run: |
          gh workflow run iac.yml --ref "$GITHUB_REF_NAME" -f stack=munni-iac-prod -f chain=staging,deploy-both
          echo "chained: Bootstrap munni-iac-prod (Logto is seeded, sign-in not wired yet) → staging → Deploy both" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.IAC_GH_PAT || secrets.GITHUB_TOKEN }}
