# Deploy stacks of the nas platform to the Synology NAS via the File
# Station API (no SSH). One bundle per stack — rendered from the committed
# platform config (infra/platforms/nas) with every placeholder filled from
# the stack's GitHub environment, each secret NAMED explicitly below (no
# toJSON(secrets): the pattern GitHub's scanner holds public-repo runs
# for). The NAS-side poller (deploy/nas/apply.sh, a Task Scheduler entry
# the shared stack's bootstrap ensures) picks the stamp up and composes the
# stack up in its own folder next to the live dir.
#
# Triggers: the wizard / the Bootstrap chain (dispatch, one stack or every
# stack of a channel), and every successful image build (dev branch →
# stacks on channel `dev`, master → channel `latest`) — the sustainable
# pipeline: merge, images build, the NAS follows.
name: Deploy to NAS

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'One stack (munni-nas-shared, munni-nas-<env>) — or empty for every stack of the channel below'
        type: string
        default: ''
      channel:
        description: 'With an empty stack: every nas stack on this image channel'
        type: choice
        options: [all, dev, latest]
        default: all
  workflow_run:
    workflows: ['Build & push images']
    types: [completed]
    branches: [dev, master]

permissions:
  contents: read
  actions: write # re-runs the Bootstrap once a deploy has seeded Logto/GlitchTip

jobs:
  stacks:
    if: ${{ vars.MUNNI_INITIALIZED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev # the platform config and the templates live on dev; images come from the channel
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Which stacks
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CH="${{ github.event.workflow_run.head_branch == 'master' && 'latest' || 'dev' }}"
            node infra/ci/matrix.mjs --platform nas --channel "$CH"
          elif [ -n "${{ inputs.stack }}" ]; then
            node infra/ci/matrix.mjs --platform nas --stack "${{ inputs.stack }}"
          else
            node infra/ci/matrix.mjs --platform nas --channel "${{ inputs.channel }}"
          fi

  deploy:
    needs: stacks
    if: ${{ needs.stacks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1 # the shared stack first (the matrix lists it first); one upload session at a time
      matrix:
        include: ${{ fromJSON(needs.stacks.outputs.include) }}
    concurrency:
      group: deploy-${{ matrix.stack }}
      cancel-in-progress: false
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Render + assemble the bundle
        id: bundle
        run: |
          set -euo pipefail
          node infra/bootstrap.mjs --stack "${{ matrix.stack }}" --render-only
          SRC="infra/rendered/${{ matrix.stack }}"
          STAGE="$RUNNER_TEMP/bundle"
          mkdir -p "$STAGE"
          cp "$SRC/docker-compose.${{ matrix.stack }}.yml" deploy/update.sh "$STAGE/"
          cp -r "$SRC/initdb" "$STAGE/"
          for f in pgadmin-servers.json Caddyfile; do [ -f "$SRC/$f" ] && cp "$SRC/$f" "$STAGE/"; done
          bash deploy/nas/render-env.sh "$SRC/.env.${{ matrix.stack }}" "$STAGE/.env"
          BUNDLE="munni-${{ matrix.stack }}.tgz"
          STAMP="VERSION_$(echo "${{ matrix.stack }}" | sed 's/^munni-//' | tr 'a-z-' 'A-Z_')"
          tar -czf "$RUNNER_TEMP/$BUNDLE" -C "$STAGE" .
          # <sha>.<run number>: every deploy is new to the poller
          echo "${{ github.sha }}.${{ github.run_number }}" > "$RUNNER_TEMP/$STAMP"
          echo "bundle=$BUNDLE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
          # every placeholder of the rendered env template, by name
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GLITCHTIP_SECRET_KEY: ${{ secrets.GLITCHTIP_SECRET_KEY }}
          GLITCHTIP_EMAIL_URL: ${{ secrets.GLITCHTIP_EMAIL_URL }}
          GLITCHTIP_ADMIN_PASSWORD: ${{ secrets.GLITCHTIP_ADMIN_PASSWORD }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          VAULT_SIGNUPS_ALLOWED: ${{ secrets.VAULT_SIGNUPS_ALLOWED }}
          CONTROL_LOGTO_APP_ID: ${{ secrets.CONTROL_LOGTO_APP_ID }}
          LOGTO_INFRA_M2M_ID: ${{ secrets.LOGTO_INFRA_M2M_ID }}
          LOGTO_INFRA_M2M_SECRET: ${{ secrets.LOGTO_INFRA_M2M_SECRET }}
          LOGTO_ADMIN_M2M_ID: ${{ secrets.LOGTO_ADMIN_M2M_ID }}
          LOGTO_ADMIN_M2M_SECRET: ${{ secrets.LOGTO_ADMIN_M2M_SECRET }}
          LOGTO_M2M_APP_ID: ${{ secrets.LOGTO_M2M_APP_ID }}
          LOGTO_M2M_APP_SECRET: ${{ secrets.LOGTO_M2M_APP_SECRET }}
          API_SENTRY_DSN: ${{ secrets.API_SENTRY_DSN }}
          GOCARDLESS_SECRET_ID: ${{ secrets.GOCARDLESS_SECRET_ID }}
          GOCARDLESS_SECRET_KEY: ${{ secrets.GOCARDLESS_SECRET_KEY }}
          ENABLEBANKING_APPLICATION_ID: ${{ secrets.ENABLEBANKING_APPLICATION_ID }}
          ENABLEBANKING_PRIVATE_KEY_PEM: ${{ secrets.ENABLEBANKING_PRIVATE_KEY_PEM }}
          PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          LOGODEV_SECRET_KEY: ${{ secrets.LOGODEV_SECRET_KEY }}
          LOGODEV_PUBLIC_TOKEN: ${{ secrets.LOGODEV_PUBLIC_TOKEN }}
          VITE_LOGTO_APP_ID: ${{ vars.VITE_LOGTO_APP_ID }}
          VITE_LOGTO_APP_ID_ADMIN: ${{ vars.VITE_LOGTO_APP_ID_ADMIN }}
          VITE_GLITCHTIP_DSN: ${{ vars.VITE_GLITCHTIP_DSN }}
          VITE_GLITCHTIP_DSN_ADMIN: ${{ vars.VITE_GLITCHTIP_DSN_ADMIN }}
      - name: Upload to Synology File Station (bundle first, stamp last)
        run: |
          set -euo pipefail
          : "${SYNOLOGY_PATH:?SYNOLOGY_PATH secret missing}"
          LIVE="${SYNOLOGY_PATH%/}"; LIVE="${LIVE%/*}"
          if [ -z "$LIVE" ] || [ "$LIVE" = "${SYNOLOGY_PATH%/}" ]; then
            echo "::error::SYNOLOGY_PATH must be a folder inside a shared folder, e.g. /docker/munni-nas/published"; exit 1
          fi
          # the poller script rides along with every bundle (the task runs a throwaway copy)
          SYNOLOGY_PATH="$LIVE" bash deploy/nas/upload.sh deploy/nas/apply.sh
          bash deploy/nas/upload.sh "$RUNNER_TEMP/${{ steps.bundle.outputs.bundle }}" "$RUNNER_TEMP/${{ steps.bundle.outputs.stamp }}"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
      # no click left: the first deploy carries the seeds; once the poller applied
      # them and the services answer with the seeded credentials, the Bootstrap
      # runs once more and turns sign-in / crash reports into code, then deploys
      # again so the frontends pick the app ids up. Ends by itself.
      - name: Wait for the poller, read its log, and see whether the seeds landed
        id: applied
        run: node deploy/nas/after-apply.mjs --stack "${{ matrix.stack }}" --stamp "${{ github.sha }}.${{ github.run_number }}"
        env:
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
          LOGTO_INFRA_M2M_ID: ${{ secrets.LOGTO_INFRA_M2M_ID }}
          LOGTO_INFRA_M2M_SECRET: ${{ secrets.LOGTO_INFRA_M2M_SECRET }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
      - name: A seed landed and its write-back is missing — run the Bootstrap once more (it chains this Deploy)
        if: ${{ (steps.applied.outputs.logto == 'answers' && vars.VITE_LOGTO_APP_ID == '') || (steps.applied.outputs.glitchtip == 'answers' && vars.VITE_GLITCHTIP_DSN == '' && matrix.role == 'env') }}
        run: |
          gh workflow run iac.yml --ref dev -f stack="${{ matrix.stack }}" -f chain=deploy
          echo "chained: Bootstrap ${{ matrix.stack }} → Deploy" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
