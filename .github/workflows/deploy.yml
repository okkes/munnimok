name: Web CI

on:
  push:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests (ignore partial detection)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    # first-boot latch: fresh repo copies skip runs until the wizard sets MUNNI_INITIALIZED
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # WebKit runs the sheet-geometry guard: all of iOS is WebKit, its layout bugs are invisible to Blink.
      # The runner's preconfigured Chrome apt repo often fails with "Hash Sum mismatch", and apt-get update
      # (run by --with-deps) fails on any broken source; Playwright brings its own browsers, so drop it and retry.
      - run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list /etc/apt/sources.list.d/google-chrome*.sources
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium webkit && exit 0
            echo "playwright install failed (attempt $attempt) — retrying in 30 s"
            sleep 30
          done
          exit 1
        working-directory: apps/web

      - run: npx vitest run --coverage
        working-directory: apps/web

      # the two-device e2e specs need it; on CI they fail when it does not answer
      - name: Start sync test stack
        run: docker compose -f deploy/docker-compose.test.yml up --build -d --wait

      # also the build the e2e gate serves (#587), so it names the test API
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: http://localhost:8181

      - name: Run Playwright tests
        run: npx playwright test
        working-directory: apps/web

      - name: Console unit tests
        run: |
          for app in admin control lab; do
            echo "== $app"
            (cd "apps/$app" && npx vitest run --coverage) || exit 1
          done

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-${{ github.run_id }}
          path: apps/web/tests/results/
          retention-days: 7
