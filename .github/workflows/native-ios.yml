# Native iOS build + TestFlight, one store identity PER environment
# (infra/platforms/<platform>/envs/<env>.json: store.iosBundleId, default
# app.munni.<platform>.<env>). Pushes build every environment whose
# channel matches the branch (dev → `dev`, master → `latest`) and that
# enables the iOS app; the wizard dispatches one stack. Stack config
# (NATIVE_* variables, ASC key, team, the persistent certificate) comes
# from the stack's GitHub environment, written by the setup.
#
# Without ASC_* secrets: unsigned simulator smoke build (artifact). With
# them: signed archive via the App Store Connect API key (automatic
# signing, -allowProvisioningUpdates registers the bundle id + push
# capability) and a direct upload to TestFlight. The app record in App
# Store Connect is the ONE manual step per bundle id.
name: Native iOS
run-name: ${{ github.event_name == 'workflow_dispatch' && format('iOS {0}', inputs.stack) || format('iOS ({0})', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Environment stack to build (munni-<platform>-<env>)'
        required: true
        type: string
  push:
    branches: [master, dev] # public repo: standard macOS runners are free

permissions:
  contents: read

jobs:
  stacks:
    # first-boot latch (MUNNI_INITIALIZED) + the iOS opt-in flag
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Which environments
        id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node infra/ci/matrix.mjs --stack "${{ inputs.stack }}" --role env
          else
            node infra/ci/matrix.mjs --role env --feature ios --channel "${{ github.ref_name == 'master' && 'latest' || 'dev' }}"
          fi

  ios:
    needs: stacks
    if: ${{ needs.stacks.outputs.count != '0' }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.stacks.outputs.include) }}
    # per stack: rapid pushes collapse to the newest build; cross-stack
    # certificate races are handled inside asc-prune.js (age guard)
    concurrency:
      group: native-ios-${{ matrix.stack }}
      cancel-in-progress: false
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # build number = commit count

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Bake catalog baseline
        run: node apps/web/scripts/bake-catalog.mjs
        env:
          CATALOG_URL: ${{ vars.NATIVE_API_URL }}/catalog

      - name: Build web bundle and sync the shell
        run: |
          npm ci
          npm run sync -w @munni/native
        env:
          VITE_API_URL: ${{ vars.NATIVE_API_URL }}
          VITE_PUBLIC_ORIGIN: ${{ vars.NATIVE_PUBLIC_ORIGIN }}
          VITE_LOGTO_ENDPOINT: ${{ vars.NATIVE_LOGTO_ENDPOINT }}
          VITE_LOGTO_APP_ID: ${{ vars.NATIVE_LOGTO_APP_ID }}
          VITE_LOGTO_RESOURCE: ${{ vars.NATIVE_LOGTO_RESOURCE }}
          VITE_GLITCHTIP_DSN: ${{ vars.NATIVE_GLITCHTIP_DSN_IOS }}
          VITE_NATIVE_SCHEME: ${{ matrix.scheme }}
          VITE_CHANNEL: ${{ matrix.appChannel }}

      # NOTE: the bundle id must be patched in the project file, not passed
      # as an xcodebuild argument — a command-line PRODUCT_BUNDLE_IDENTIFIER
      # applies to EVERY target (embedded Capacitor frameworks included) and
      # the upload dies with "CFBundleIdentifier Collision".
      - name: Rebrand the shell for this environment
        working-directory: apps/native/ios/App
        env:
          BUNDLE_ID: ${{ matrix.iosBundleId }}
          URL_SCHEME: ${{ matrix.scheme }}
          DISPLAY_NAME: ${{ matrix.label }}
          ORIGIN: ${{ vars.NATIVE_PUBLIC_ORIGIN }}
        run: |
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = app\.munni;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" App.xcodeproj/project.pbxproj
          grep -c "$BUNDLE_ID" App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName $DISPLAY_NAME" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLName $BUNDLE_ID" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleURLTypes:0:CFBundleURLSchemes:0 $URL_SCHEME" App/Info.plist
          if [ "${{ matrix.appChannel }}" != "production" ]; then
            # non-production look: white leaf on brand green
            sed -i '' 's/ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;/ASSETCATALOG_COMPILER_APPICON_NAME = "AppIcon-Dev";/g' App.xcodeproj/project.pbxproj
          fi
          # ONE associated domain per environment: its own web host (universal links);
          # a host that is not publicly reachable over trusted https (lcl) claims none
          HOST="$(node -p "new URL(process.env.ORIGIN || 'https://local.munni.invalid').hostname")"
          if [ "${{ matrix.platform }}" = "lcl" ] || [ "$HOST" = "local.munni.invalid" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.associated-domains" App/App.entitlements || true
          else
            /usr/libexec/PlistBuddy -c "Set :com.apple.developer.associated-domains:0 applinks:$HOST" App/App.entitlements
            /usr/libexec/PlistBuddy -c "Print :com.apple.developer.associated-domains" App/App.entitlements
          fi

      # the wizard's Firebase automation hands the REAL per-environment plist as a variable
      - name: Bake the Firebase config
        if: vars.NATIVE_IOS_FIREBASE_PLIST_B64 != ''
        working-directory: apps/native/ios/App
        run: echo "$PLIST_B64" | base64 -d > App/GoogleService-Info.plist
        env:
          PLIST_B64: ${{ vars.NATIVE_IOS_FIREBASE_PLIST_B64 }}

      # Apple requires the iOS 26 SDK for App Store Connect uploads; the
      # runner's default Xcode is older, so pick the newest installed one
      - name: Select the newest Xcode
        run: |
          LATEST="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install pods
        working-directory: apps/native/ios/App
        run: pod install

      - name: Restore the App Store Connect API key
        id: asc
        run: |
          if [ -n "$ASC_KEY_B64" ]; then
            echo "$ASC_KEY_B64" | base64 -d > "$RUNNER_TEMP/asc.p8"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_P8 }}

      # ---- no Apple key: unsigned smoke build so CI still guards the shell ----
      - name: Build (unsigned, simulator) as a smoke test
        if: steps.asc.outputs.present == 'false'
        working-directory: apps/native/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Upload simulator artifact
        if: steps.asc.outputs.present == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: munni-ios-simulator-${{ matrix.stack }}
          path: apps/native/ios/App/build/Build/Products/Debug-iphonesimulator/App.app
          retention-days: 14

      # ---- Apple key present: archive, sign automatically, upload to TestFlight ----
      # Automatic signing archives against a development profile, and Apple issues one
      # only for a team with an ENABLED registered device — ask first: a team without one
      # is a notice naming the one-click fix, never an ARCHIVE FAILED on every push
      - name: Enabled device at Apple?
        id: devices
        if: steps.asc.outputs.present == 'true'
        run: node .github/scripts/asc-devices.js
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: No enabled device — the archive waits for one
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled == '0'
        run: |
          echo "::warning title=iOS archive skipped::Apple issues the development profile automatic signing archives against only for a team with an ENABLED registered device — this team has ${{ steps.devices.outputs.disabled }} registered, none enabled. Once: developer.apple.com → Certificates, Identifiers & Profiles → Devices → enable a registered iPhone (or ＋ to register any iPhone you own: name + UDID, which iTunes or Finder shows behind the serial number). Every push after that builds; TestFlight itself needs no device."
          echo "iOS archive skipped: no enabled registered device on the Apple team (${{ steps.devices.outputs.disabled }} registered, all disabled) — enable one at developer.apple.com → Devices, the next push builds" >> "$GITHUB_STEP_SUMMARY"

      - name: Compute build number (push = commit count, dev gets .1; dispatch = seconds since 2026)
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0'
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # redispatching the same commit must not reuse a build number (TestFlight refuses the duplicate)
            CODE=$(( $(date +%s) - 1767225600 ))
          else
            CODE=$(git rev-list --count HEAD)
            # the same sha on both branches (post-merge sync) would otherwise upload the same build number twice
            [ "${{ github.ref_name }}" = "dev" ] && CODE="$CODE.1"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A persistent signing certificate ends the mint-and-revoke churn:
      # automatic signing only mints a NEW Apple Development cert when no
      # usable private key is in the keychain. mint-apple-cert.yml makes
      # one without a Mac; the whole Apple team shares THAT one — the wizard
      # stores it as APPLE_DEV_CERT_P12 (base64) + APPLE_DEV_CERT_PASSWORD in
      # every environment that builds iOS.
      - name: Import persistent signing certificate
        id: signingcert
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0'
        run: |
          if [ -z "$CERT_B64" ]; then
            echo "no persistent cert configured — automatic signing will mint one"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -A -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          SERIAL="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -nokeys -passin env:CERT_PASSWORD 2>/dev/null | openssl x509 -noout -serial 2>/dev/null | cut -d= -f2)"
          rm "$RUNNER_TEMP/cert.p12"
          if [ -z "$SERIAL" ]; then
            echo "::error title=Persistent certificate unreadable::the keychain took APPLE_DEV_CERT_P12 but openssl could not read the certificate inside it — re-mint with mint-apple-cert.yml"
            exit 1
          fi
          echo "imported the persistent certificate (serial $SERIAL)"
          echo "serial=$SERIAL" >> "$GITHUB_OUTPUT"
          echo "present=true" >> "$GITHUB_OUTPUT"
        env:
          CERT_B64: ${{ secrets.APPLE_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEV_CERT_PASSWORD }}

      # A revoked or expired persistent certificate imports without a word,
      # and Xcode then silently mints a throwaway per build until Apple's cap
      # ends the builds — fail fast, name the fix
      - name: Check the persistent certificate is still valid at Apple
        if: steps.signingcert.outputs.present == 'true'
        run: node .github/scripts/asc-cert-check.js
        env:
          CERT_SERIAL: ${{ steps.signingcert.outputs.serial }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # Every ephemeral runner without the persistent cert mints a NEW Apple
      # Development certificate during archive — left alone they pile up
      # until Apple's cap. Prune the stale dev certs via the ASC API; the
      # persistent cert is protected by serial, never by age.
      - name: Prune CI-minted development certificates
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0'
        run: node .github/scripts/asc-prune.js
        env:
          PROTECT_SERIALS: ${{ steps.signingcert.outputs.serial }}
          KEEP_NEWEST: ${{ steps.signingcert.outputs.present == 'true' && '1' || '3' }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # Automatic signing archives against a DEVELOPMENT profile (the export re-signs for
      # the store), and Apple issues one only for a team with at least one ENABLED registered
      # device ("Your team has no devices from which to generate a provisioning profile",
      # nas-dev 2026-09-19: three iPhones registered, all disabled). "Apple Distribution"
      # under automatic style conflicts ("App is automatically signed for development, but a
      # conflicting code signing identity Apple Distribution has been manually specified") —
      # from the project file just as from the command line, both proven 2026-09-19. So the
      # archive stays automatic and a device-less team is named as the fix.
      - name: Archive (automatic signing via the ASC key)
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0'
        working-directory: apps/native/ios/App
        run: |
          set +e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" 2>&1 | tee "$RUNNER_TEMP/archive.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "Cloud signing permission error" "$RUNNER_TEMP/archive.log"; then
            echo "::error title=ASC key cannot cloud-sign::The App Store Connect API key cannot create/use the cloud-managed certificate. Fix once: App Store Connect → Users and Access → Integrations → this key → role Admin (or App Manager WITH 'Access to Cloud Managed Distribution Certificate' ticked), wait a minute, rebuild."
          fi
          if [ "$status" -ne 0 ] && grep -q "has no devices from which to generate a provisioning profile" "$RUNNER_TEMP/archive.log"; then
            echo "::error title=Enable one device at Apple::Automatic signing archives against a development profile, and Apple issues one only for a team with at least one ENABLED registered device — yours has none. Once: developer.apple.com → Certificates, Identifiers & Profiles → Devices → enable a registered iPhone (or ＋ to register any iPhone you own: name + UDID, which iTunes or Finder shows behind the serial number). Then press Build again. TestFlight itself needs no device."
          fi
          exit "$status"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Apple keeps ONE step manual — the app record (no create-API). Ask before exporting:
      # a missing record is a notice and the signed archive the deliverable, never an "EXPORT FAILED"
      - name: App Store Connect record?
        id: record
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0'
        run: node .github/scripts/asc-app-record.js
        env:
          BUNDLE_ID: ${{ matrix.iosBundleId }}
          ASC_KEY_PATH: ${{ runner.temp }}/asc.p8
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: No app record yet — the signed archive is the deliverable
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0' && steps.record.outputs.exists == 'false'
        run: |
          echo "::notice title=TestFlight upload skipped::App Store Connect has no app record for ${{ matrix.iosBundleId }} yet — the build archived and signed fine. Create the record once (appstoreconnect.apple.com → Apps → ＋ → New App, platform iOS, bundle ${{ matrix.iosBundleId }}, any name and SKU); every build after that uploads to TestFlight by itself."
          echo "TestFlight upload skipped: App Store Connect has no app record for ${{ matrix.iosBundleId }} yet — create it once, the next build uploads" >> "$GITHUB_STEP_SUMMARY"

      - name: Export and upload to TestFlight
        if: steps.asc.outputs.present == 'true' && steps.devices.outputs.enabled != '0' && steps.record.outputs.exists != 'false'
        working-directory: apps/native/ios/App
        run: |
          cat > "$RUNNER_TEMP/exportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          # Apple caps TestFlight uploads per app per day: degrade to a warning; every other failure stays fatal
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "Upload limit reached" "$RUNNER_TEMP/export.log"; then
            echo "::warning title=TestFlight upload skipped::Apple's daily upload limit is reached — the build archived and signed fine; the next quiet day's push uploads again."
            exit 0
          fi
          # "Error Downloading App Information" = App Store Connect has no app record for
          # this bundle id yet — the ONE step Apple keeps manual (no create-API): a warning,
          # the archive is the deliverable until the record exists
          if [ "$status" -ne 0 ] && grep -q "Error Downloading App Information" "$RUNNER_TEMP/export.log"; then
            echo "::warning title=TestFlight upload skipped::App Store Connect has no app record for ${{ matrix.iosBundleId }} — create it once (appstoreconnect.apple.com → Apps → ＋ → New App, platform iOS, bundle ${{ matrix.iosBundleId }}, any name/SKU), then rebuild. The build itself archived and signed fine."
            exit 0
          fi
          if [ "$status" -ne 0 ] && grep -q "Cloud signing permission error" "$RUNNER_TEMP/export.log"; then
            echo "::error title=ASC key cannot cloud-sign::The App Store Connect API key cannot create/use the cloud-managed Apple Distribution certificate. Fix once: App Store Connect → Users and Access → Integrations → this key → role Admin (or App Manager WITH 'Access to Cloud Managed Distribution Certificate' ticked), wait a minute, rebuild."
          fi
          exit "$status"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
