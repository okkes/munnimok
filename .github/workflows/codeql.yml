name: CodeQL

# push-only: a pull_request run repeats the push and fails to start on release-please's PR,
# whose token cannot read `vars` for the first-boot latch (#393)
on:
  push:
    branches: [main, master, dev]
  schedule:
    - cron: '30 5 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # first-boot latch: fresh repo copies skip runs until the wizard sets MUNNI_INITIALIZED
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 11.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
