name: CodeQL

# Push-only: every branch a pull request can target (dev, master) is
# analyzed on push, so a pull_request run would only repeat it. It was
# also the one run that could not start: a pull request opened by a
# workflow (release-please's "chore(master): release x.y.z") runs under
# that workflow's token, and the first-boot latch below could not read
# `vars` there — the run failed before any job existed (#393, 2026-09-17).
on:
  push:
    branches: [main, master, dev]
  schedule:
    - cron: '30 5 * * 1' # weekly deep scan

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # first-boot latch: fresh repo copies skip every run until the
    # wizard marks the repo initialized (variable MUNNI_INITIALIZED)
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: autobuild
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended (see the config file); code quality is
          # owned by SonarQube + ESLint + Roslyn analyzers
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
