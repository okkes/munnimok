name: Bootstrap
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Bootstrap {0}{1}', inputs.stack, inputs.cleanup == true && ' (cleanup)' || (inputs.verify_only == true && ' (verify)' || '')) || 'Verify the nas stacks' }}

# Runs infra/bootstrap.mjs for one stack of the nas platform (its GitHub
# environment carries the secrets). Dispatched by the setup wizard when a
# platform or an environment is created, re-run by Deploy once a deploy
# has seeded Logto/GlitchTip, and by hand from the Actions UI. Pushes to
# dev that touch infra/ VERIFY every nas stack (no writes).
on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack (munni-nas-shared, munni-nas-<env>)'
        required: true
        type: string
      verify_only:
        description: 'Only verify (no writes)'
        type: boolean
        default: false
      rotate:
        description: 'Comma-separated generated secrets to re-mint (--rotate)'
        type: string
        default: ''
      chain:
        description: 'After a green apply: deploy (this stack) — dispatched by the wizard'
        type: string
        default: ''
      cleanup:
        description: 'CLEAN UP this stack instead: rules, containers + folder (via the poller), GlitchTip projects, its GitHub environment and platform file; the shared stack also removes the poller task + live dir once no environment is left'
        type: boolean
        default: false
  push:
    branches: [dev]
    paths: ['infra/**', '.github/workflows/iac.yml']

permissions:
  contents: write # a cleanup commits the removed platform file
  actions: write # the chain step dispatches the next run

jobs:
  stacks:
    # first-boot latch: fresh repo copies skip every run until the wizard marks the repo initialized
    if: ${{ vars.MUNNI_INITIALIZED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.m.outputs.include }}
      count: ${{ steps.m.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Infra module tests
        run: node --test "infra/tests/**/*.test.mjs"
      - name: Which stacks
        id: m
        run: node infra/ci/matrix.mjs --platform nas ${{ github.event_name == 'workflow_dispatch' && format('--stack {0}', inputs.stack) || '' }}

  bootstrap:
    needs: stacks
    if: ${{ needs.stacks.outputs.count != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.stacks.outputs.include) }}
    # one APPLY per stack at a time; verifies get their own group so a
    # queued verify can never cancel a pending apply
    concurrency:
      group: iac-${{ matrix.stack }}-${{ (github.event_name == 'push' || inputs.verify_only == true) && 'verify' || 'apply' }}
      cancel-in-progress: ${{ github.event_name == 'push' || inputs.verify_only == true }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Bootstrap / verify / clean up
        id: boot
        run: |
          set -o pipefail
          FLAGS=()
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.verify_only }}" = "true" ]; then
            FLAGS+=(--verify)
          fi
          if [ -n "${{ inputs.rotate }}" ] && [ "${#FLAGS[@]}" -eq 0 ]; then
            FLAGS+=(--rotate "${{ inputs.rotate }}")
          fi
          if [ "${{ inputs.cleanup }}" = "true" ] && [ "${#FLAGS[@]}" -eq 0 ]; then
            FLAGS+=(--cleanup)
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rc=0
          node infra/bootstrap.mjs --stack "${{ matrix.stack }}" "${FLAGS[@]}" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || rc=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            if [ "${FLAGS[0]:-}" = "--verify" ] && [ "${{ github.event_name }}" = "push" ]; then
              echo "::warning::verify reported gaps — dispatch with verify_only for a red/green verdict"
              exit 0
            fi
            exit $rc
          fi
        env:
          # gh needs a token that can manage environments + secrets — GITHUB_TOKEN cannot; the wizard stores GH_PAT
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # the platform (mirrored into every environment of it)
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
          SYNOLOGY_URL: ${{ secrets.SYNOLOGY_URL }}
          SYNOLOGY_USER: ${{ secrets.SYNOLOGY_USER }}
          SYNOLOGY_PASS: ${{ secrets.SYNOLOGY_PASS }}
          SYNOLOGY_PATH: ${{ secrets.SYNOLOGY_PATH }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          GLITCHTIP_API_TOKEN: ${{ secrets.GLITCHTIP_API_TOKEN }}
          GLITCHTIP_ADMIN_PASSWORD: ${{ secrets.GLITCHTIP_ADMIN_PASSWORD }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
          VAULT_ADMIN_EMAIL: ${{ secrets.VAULT_ADMIN_EMAIL }}
          VAULT_MASTER_PASSWORD: ${{ secrets.VAULT_MASTER_PASSWORD }}
          # the stack
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          LOGTO_INFRA_M2M_ID: ${{ secrets.LOGTO_INFRA_M2M_ID }}
          LOGTO_INFRA_M2M_SECRET: ${{ secrets.LOGTO_INFRA_M2M_SECRET }}
          LOGTO_ADMIN_M2M_ID: ${{ secrets.LOGTO_ADMIN_M2M_ID }}
          LOGTO_ADMIN_M2M_SECRET: ${{ secrets.LOGTO_ADMIN_M2M_SECRET }}
          LOGTO_CONSOLE_USERNAME: ${{ secrets.LOGTO_CONSOLE_USERNAME }}
          LOGTO_CONSOLE_PASSWORD: ${{ secrets.LOGTO_CONSOLE_PASSWORD }}
          LOGTO_GOOGLE_CLIENT_ID: ${{ secrets.LOGTO_GOOGLE_CLIENT_ID }}
          LOGTO_GOOGLE_CLIENT_SECRET: ${{ secrets.LOGTO_GOOGLE_CLIENT_SECRET }}
          LOGTO_APPLE_CLIENT_ID: ${{ secrets.LOGTO_APPLE_CLIENT_ID }}
          LOGTO_APPLE_TEAM_ID: ${{ secrets.LOGTO_APPLE_TEAM_ID }}
          LOGTO_APPLE_KEY_ID: ${{ secrets.LOGTO_APPLE_KEY_ID }}
          LOGTO_APPLE_PRIVATE_KEY: ${{ secrets.LOGTO_APPLE_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Commit a removed platform file (cleanup)
        if: ${{ inputs.cleanup == true && !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain infra/platforms)" ]; then
            git config user.name "munni setup"
            git config user.email "setup@munni.invalid"
            git add infra/platforms
            git commit -m "chore(platforms): remove ${{ matrix.stack }} (cleanup)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "platform file removed and committed" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mask the domain in the artifact (this repository is public — the domain is a secret)
        if: ${{ !cancelled() }}
        run: |
          if [ -n "${PLATFORM_DOMAIN:-}" ] && [ -d "infra/rendered/${{ matrix.stack }}" ]; then
            grep -rlF --null -- "$PLATFORM_DOMAIN" "infra/rendered/${{ matrix.stack }}" | xargs -0 -r sed -i "s/$PLATFORM_DOMAIN/<domain>/g"
          fi
        env:
          PLATFORM_DOMAIN: ${{ secrets.PLATFORM_DOMAIN }}
      - name: Upload rendered stack + runbook
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.stack }}-${{ github.run_number }}
          path: infra/rendered/${{ matrix.stack }}/
          retention-days: 30
          if-no-files-found: ignore
      - name: Chain the deploy
        # the wizard dispatches with chain=deploy: a green apply is followed by the
        # stack's Deploy — never over a NAS that refused the deploy account
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only != true && inputs.cleanup != true && inputs.chain == 'deploy' && steps.boot.outputs.nas != 'blocked' }}
        run: |
          gh workflow run deploy-nas.yml --ref "$GITHUB_REF_NAME" -f stack="${{ matrix.stack }}"
          echo "chained: Deploy ${{ matrix.stack }}" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Chain skipped — the deploy account may not use DSM
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only != true && inputs.cleanup != true && inputs.chain == 'deploy' && steps.boot.outputs.nas == 'blocked' }}
        run: |
          echo "::notice::nothing chained — DSM refused the deploy account (402/105). Control Panel → User & Group → the deploy user: Applications DSM + File Station allowed, User groups administrators; Security → Account: no 2FA/Adaptive MFA for it. Then run Bootstrap again."
