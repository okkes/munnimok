# munni-iac-prod — RENDERED by infra/bootstrap.mjs, do not edit by hand.
# Reverse proxy (DSM): munni-iac.okkes.synology.me -> :8290, munni-iac-api.okkes.synology.me -> :8292,
# munni-iac-admin.okkes.synology.me -> :8291 (LAN only),
# logto-iac.okkes.synology.me -> :3101, logto-iac-admin.okkes.synology.me -> :3102 (LAN only), glitchtip-iac.okkes.synology.me -> :8293

services:
  web:
    image: ${REGISTRY}/munni-web:${TAG}
    restart: unless-stopped
    ports:
      - "8290:80"

  admin:
    image: ${REGISTRY}/munni-admin:${TAG}
    restart: unless-stopped
    ports:
      - "8291:80"

  api:
    image: ${REGISTRY}/munni-api:${TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=postgres;Database=munni;Username=munni;Password=${POSTGRES_PASSWORD}
      Db__AutoMigrate: "true"
      Auth__Authority: https://logto-iac.okkes.synology.me/oidc
      Auth__Audience: https://munni-iac-api.okkes.synology.me
      Cors__Origins__0: https://munni-iac.okkes.synology.me
      Cors__Origins__1: https://munni-iac-admin.okkes.synology.me
      Cors__Origins__2: https://localhost
      Cors__Origins__3: capacitor://localhost
      GoCardless__SecretId: ${GOCARDLESS_SECRET_ID}
      GoCardless__SecretKey: ${GOCARDLESS_SECRET_KEY}
      EnableBanking__ApplicationId: ${ENABLEBANKING_APPLICATION_ID:-}
      EnableBanking__PrivateKeyPem: ${ENABLEBANKING_PRIVATE_KEY_PEM:-}
      Push__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_VAPID_SUBJECT:-mailto:admin@localhost}
      Fcm__ServiceAccountJson: ${FCM_SERVICE_ACCOUNT_JSON:-}
      Logos__SecretKey: ${LOGODEV_SECRET_KEY:-}
      Logos__PublicToken: ${LOGODEV_PUBLIC_TOKEN:-}
      Admin__Subs: ${ADMIN_SUBS:-}
      Sentry__Dsn: ${API_SENTRY_DSN:-}
      Logto__M2mAppId: ${LOGTO_M2M_APP_ID:-}
      Logto__M2mAppSecret: ${LOGTO_M2M_APP_SECRET:-}
      BUILD_NUMBER: ${TAG}
      Ocr__BaseUrl: http://ocr:8884
    ports:
      - "8292:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ocr:
    image: hertzg/tesseract-server:latest
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: munni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: munni
    volumes:
      - pgdata:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U munni"]
      interval: 5s
      timeout: 3s
      retries: 10

  logto:
    image: svhd/logto:1.41
    restart: unless-stopped
    entrypoint: ["sh", "-c", "npm run alteration deploy latest || true; npm run cli db seed -- --swe && npm run alteration deploy latest && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://munni:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: https://logto-iac.okkes.synology.me
      ADMIN_ENDPOINT: https://logto-iac-admin.okkes.synology.me
      PORT: "3101"
      ADMIN_PORT: "3102"
    extra_hosts:
      - "logto-iac.okkes.synology.me:host-gateway"
      - "logto-iac-admin.okkes.synology.me:host-gateway"
    ports:
      - "3101:3101"
      - "3102:3102"
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    restart: "no"
    command: ./manage.py migrate
    environment: &glitchtip_env
      DATABASE_URL: postgres://munni:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      REDIS_URL: redis://valkey:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://glitchtip-iac.okkes.synology.me
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      CELERY_WORKER_AUTOSCALE: "1,3"
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment: *glitchtip_env
    ports:
      - "8293:8000"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_started

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip_env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped

volumes:
  pgdata:
