# app links: /.well-known/apple-app-site-association + assetlinks.json are
# rendered per deployment by the start script (deploy/nginx/40-runtime-config.sh)
# from the MUNNI_* env — one image, every host claims exactly its own app
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # PWA rules: the app shell and service worker must never be cached
    # stale, hashed assets are immutable. Each add_header location must
    # re-include the security headers (nginx inheritance rule).
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # per-deployment config overlay, rewritten by the entrypoint — must
    # never be cached stale or a redeploy keeps serving old endpoints
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # universal links (UL1): Apple/Google fetch these — JSON type, no
    # redirects, modest cache so fixes propagate; content is per-host
    location = /.well-known/apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/html/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # hash-history SPA: unknown paths fall back to the shell
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
