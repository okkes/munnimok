# the app-links files under /.well-known are rendered per host by deploy/nginx/40-runtime-config.sh: each host claims only its own app
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # shell and service worker are never cached stale, hashed assets are immutable;
    # each add_header location re-includes the security headers (nginx inheritance)
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # rewritten per deployment: stale caching would keep serving old endpoints after a redeploy
    location = /runtime-config.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    # the native shells read the hosted build from their own origin (https://localhost,
    # capacitor://localhost): public version information, so any origin may have it
    location = /version.json {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Apple/Google fetch these: JSON type, no redirects, modest cache so fixes propagate
    location = /.well-known/apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /apple-app-site-association {
        alias /usr/share/nginx/html/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /.well-known/assetlinks.json {
        alias /usr/share/nginx/html/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
