# Analyzed by deploy/sonar/analyze.ps1 against the local SonarQube
# (deploy/docker-compose.sonar.yml). Not used in CI.
sonar.projectKey=munni-web
sonar.projectName=munni web
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx
sonar.exclusions=src/i18n/**,src/db/demo-data.ts,src/domain/keyword-categories.ts,src/domain/categories.ts,src/domain/countries.ts,src/**/*.scratch.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
