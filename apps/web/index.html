<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <!-- interactive-widget: Android resizes the layout for the keyboard and restores it when it hides; iOS ignores it -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <!-- not black-translucent: modern iOS then sizes the standalone layout (screen minus status bar) but anchors it at the
       glass top, leaving an unpaintable band under the tab bar; with 'default' the webview reaches the real bottom -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)"/>
  <meta name="theme-color" content="#191714" media="(prefers-color-scheme: dark)"/>
  <title>munni — finance app</title>
</head>
<body>
  <div id="root"></div>
  <!-- window.__MUNNI_CONFIG__: rewritten by the nginx entrypoint per deployment; the committed stub sets nothing -->
  <script src="/runtime-config.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
