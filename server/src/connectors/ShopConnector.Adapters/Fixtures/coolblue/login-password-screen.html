<!--
  coolblue's SECOND sign-in screen - the one that asks for the password.

  A REAL capture of 2026-08-07, redacted: the account owner's address is
  replaced and all three csrf tokens are substituted.

  THIS PAGE COST THE ACCOUNT OWNER A PASSWORD-RESET E-MAIL, and it is kept so
  that never happens again. It carries THREE submit buttons, and the first one
  in document order is not the login:

    1. Wachtwoord vergeten?   form="form__request_password_reset"
    2. Inloggen               no form attribute - its own form's submit
    3. Log in met code        form="form__request_passwordless_login"

  The adapter's submit selector was a bare button[type='submit'], which takes
  the first match - so a login typed the password in correctly and then asked
  Coolblue to reset it.

  The discriminator is structural rather than cosmetic: a submit button that
  names ANOTHER form by id is, by definition, not this form's submit. Hence
  :not([form]) on every candidate. The reset button also carries
  data-action="reset-password", which is a second, independent marker.

  Note also that this screen has a REAL password input - no tabindex="-1" -
  unlike the first screen, whose only password field is a decoy.
-->

        <script>
    function getCookie(name) {
        if (typeof name !== 'string' || !name) return null;

        try {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return null;
        } catch (e) {
            console.error('Error reading cookie:', e);
            return null;
        }
    }
