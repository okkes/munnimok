<!--
  coolblue accounts.coolblue.nl sign-in page. REAL capture, 2026-08-07, signed
  out, so it carries no personal data.

  Kept for a trap Coolblue built deliberately and documented in its own markup:
  the ONLY input of type password on this screen is a DECOY for browser
  password managers. It sits inside a div marked data-hidden and aria-hidden,
  carries tabindex minus one, and Coolblue's own comment above it says they
  added it so password managers behave.

  Every one of the adapter's original PasswordSelectors matched it - by name,
  by autocomplete and by type alike - so a login would have typed the password
  into a field nobody reads and submitted the e-mail address on its own.

  The page also carries two hidden inputs named username beside the real e-mail
  box, which is why the username candidates are ordered the way they are.
-->

        <script>
    function getCookie(name) {
        if (typeof name !== 'string' || !name) return null;

        try {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) {
                return parts.pop().split(';').shift();
            }
            return null;
        } catch (e) {
            console.error('Error reading cookie:', e);
            return null;
        }
    }

    var session_id= getCookie('cbvid')

    var userProperties={
        'application': 'gandalf',

</script>


<script src="https://assets.coolblue.nl/js/mimir/v2/client.js"></script>
<script>

            session_id,
            user_properties: {...userProperties},
            version: "web/v1",

            if (['page_view', 'view_context', 'split_tests'].includes(name)) {
                window.mimir.event(name, params);
            }
        });
    }
</script>




<script>
// Android
if (typeof window?.AnalyticsWebInterface?.logGa4Event === 'function') {

}

                <div>
                    <cb-email-exists>
                        <form method="post" action="#" spellcheck="false">
                            <input type="hidden" name="view" value="email-exists">
                            <input type="hidden" name="csrf" value="not-a-real-csrf-token">
                            <fieldset>
                                <legend>Inloggen</legend>
                                <div class="grid gap--4">
                                    <div class="grid">
                                        
                                        <div>
                                            <label>
                                                Je e-mailadres
                                                <with-custom-errors value-missing="Er is geen e-mailadres ingevuld." type-mismatch="Oeps, dit is geen geldig e-mailadres." pattern-mismatch="Oeps, dit is geen geldig e-mailadres.">
                                                    <!-- Ensure RFC 3696 compliant pattern: https://datatracker.ietf.org/doc/html/rfc3696#page-5 -->
                                                    <input
                                                        type="email"
                                                        pattern="[\p{L}\d!#$%&\x27*+\-\/=?^_`\{\|\}~]+(?:\.[\p{L}\d!#$%&\x27*+\-\/=?^_`\{\|\}~]+)*@(?:(?!-[a-zA-Z0-9]+\.)(?![a-zA-Z0-9]+-\.)(?![a-zA-Z0-9]+--[a-zA-Z0-9]+\.)[a-zA-Z0-9\-]+\.)+[a-zA-Z][a-zA-Z0-9]+"
                                                        name="username"
                                                        autocomplete="username"
                                                        value=""
                                                        required
                                                        class="input__textlike with-icon"
                                                        autofocus />
                                                </with-custom-errors>
                                            </label>
                                            <!-- iOS does not understand a one-step form and will paste the password of a saved set of credentials into the username field,
                                            unless we add a hidden password field to the html 🤷‍♂️ -->
                                            <div data-hidden aria-hidden="true"><input tabindex="-1" type="password" name="password" autocomplete="current-password"></div>
                                        </div>
                                        
                                    </div>

                                    </div>
