# Local-only SonarQube, deliberately not in the NAS stack (needs ~2-3 GB RAM).
# First time: http://localhost:9000 admin/admin, new password, generate a token into
# SONAR_TOKEN in deploy/env/.env.local; then run deploy/sonar/analyze.ps1.
name: munni-sonar
services:
  sonarqube:
    image: sonarqube:community
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs

volumes:
  sonar_data:
  sonar_extensions:
  sonar_logs:
