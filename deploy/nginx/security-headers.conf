# add_header is NOT inherited into a location that declares its own: each such location must include
# this file again.
# CSP: script-src 'self' is the XSS backstop for OIDC tokens in localStorage (docs/security-review.md).
# style-src 'unsafe-inline' is for React inline styles. connect-src stays open so one image serves
# every environment (origins differ); only foreign script matters. img-src allows any https image
# (logo.dev, vendored bank logos): images cannot run script. frame-ancestors supersedes X-Frame-Options.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src *; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' data: blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# camera=() forbids getUserMedia document-wide and Chromium obeys silently (no prompt) (#160); self re-arms webcam capture
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
