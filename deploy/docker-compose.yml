# munni production stack for Synology NAS (Container Manager project).
# Secrets come from ./env/.env.local (git-ignored) — copy env/.env.example.
# DSM reverse proxy terminates HTTPS on *.okkes.synology.me and forwards:
#   munni.        -> web:80
#   munni-api.    -> api:8080
#   logto.        -> logto:3001
#   logto-admin.  -> logto:3002   (restrict to LAN in DSM firewall)
#   glitchtip.    -> glitchtip:8000

services:
  web:
    image: ${REGISTRY:-ghcr.io/okkes}/munni-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8090:80"

  api:
    image: ${REGISTRY:-ghcr.io/okkes}/munni-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=postgres;Database=munni;Username=munni;Password=${POSTGRES_PASSWORD}
      Db__AutoMigrate: "true"
      Auth__Authority: https://logto.${DOMAIN}/oidc
      Auth__Audience: ${LOGTO_API_RESOURCE}
      Cors__Origins__0: https://munni.${DOMAIN}
      GoCardless__SecretId: ${GOCARDLESS_SECRET_ID}
      GoCardless__SecretKey: ${GOCARDLESS_SECRET_KEY}
      Push__VapidPublicKey: ${PUSH_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${PUSH_VAPID_PRIVATE_KEY:-}
      Push__Subject: ${PUSH_VAPID_SUBJECT:-mailto:admin@localhost}
      # comma-separated OIDC subs that may open the in-app admin area
      Admin__Subs: ${ADMIN_SUBS:-}
      Sentry__Dsn: ${API_SENTRY_DSN:-}
      BUILD_NUMBER: ${TAG:-latest}
    ports:
      - "8091:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: munni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: munni
    volumes:
      - pgdata:/var/lib/postgresql/data
      # creates the logto + glitchtip databases on first start
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munni"]
      interval: 5s
      timeout: 3s
      retries: 10

  logto:
    image: svhd/logto:1.24
    restart: unless-stopped
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      TRUST_PROXY_HEADER: "1"
      DB_URL: postgres://munni:${POSTGRES_PASSWORD}@postgres:5432/logto
      ENDPOINT: https://logto.${DOMAIN}
      ADMIN_ENDPOINT: https://logto-admin.${DOMAIN}
    ports:
      - "3001:3001"
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  glitchtip:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    environment: &glitchtip_env
      DATABASE_URL: postgres://munni:${POSTGRES_PASSWORD}@postgres:5432/glitchtip
      REDIS_URL: redis://valkey:6379/0
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY}
      GLITCHTIP_DOMAIN: https://glitchtip.${DOMAIN}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      CELERY_WORKER_AUTOSCALE: "1,3"
    ports:
      - "8092:8000"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip_env
    depends_on:
      glitchtip:
        condition: service_started

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped

  # nightly logical backup into a folder Hyper Backup picks up
  db-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c", "while true; do pg_dumpall -h postgres -U munni > /backups/munni-$(date +%F).sql && find /backups -name '*.sql' -mtime +14 -delete; sleep 86400; done"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
