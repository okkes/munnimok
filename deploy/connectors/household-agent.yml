# The connector agent a household runs on its own machine (#367).
#
# The app renders this file with the control plane's address and a one-time enrollment code
# (single-use, 15 min), so nothing here stays secret.
#
# Why on the person's machine: DUO (DigiD scores the address) and ASN (edge login kept in a browser
# profile) only talk to a browser on the account holder's own connection. The agent dials OUT:
# no port, hostname or firewall rule needed.
#
# agent_profiles = logged-in browser profiles, agent_state = the enrollment; losing the state needs
# a fresh code. Two agents must never share these volumes.
#
# Egress is a claim the control plane believes: a data-centre machine must set
# AGENT_EGRESS_KIND=datacenter or it is offered work its address fails.
#
# stop_grace_period: the agent drains a job 20 s + reports an abort 8 s; Docker's 10 s default
# would SIGKILL a Chromium holding a signed-in profile mid-form.

name: munni-connector-agent
services:
  agent:
    image: ${AGENT_IMAGE:-ghcr.io/okkes/munni-connector-agent:latest}
    restart: unless-stopped
    shm_size: 1gb
    init: true
    stop_grace_period: 45s
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectorAgent__Class: byo
      ConnectorAgent__Egress__Country: ${AGENT_EGRESS_COUNTRY:-NL}
      ConnectorAgent__Egress__Kind: ${AGENT_EGRESS_KIND:-residential}
      ConnectorAgent__BrowserLocale: nl-NL
      ConnectorAgent__BrowserTimezoneId: Europe/Amsterdam
      ConnectorAgent__MaxConcurrency: "1"
      ConnectorAgent__Headless: "false"
      ConnectorAgent__StateFilePath: /state/agent-state.json
      ConnectorAgent__ProfileRootDirectory: /profiles
      ConnectorAgent__AgentName: ${AGENT_NAME:-my computer}
      # the environment's connector control plane, reached through the munni API's public host
      ConnectorAgent__Connections__0__Name: munni
      ConnectorAgent__Connections__0__ControlPlaneBaseUrl: ${CONNECTOR_URL:?set CONNECTOR_URL to the address the app shows}
      ConnectorAgent__Connections__0__EnrollmentCode: ${ENROLLMENT_CODE:-}
    volumes:
      - agent_state:/state
      - agent_profiles:/profiles
volumes:
  agent_state:
  agent_profiles:
